<script>
'use strict';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('map-overview'),localCanvas=$('map-local'),trajectoryCanvas=$('trajectory');
video.defaultPlaybackRate=video.playbackRate=Number($('speed').value);
const popup=new URLSearchParams(location.search).has('map');if(popup)document.body.classList.add('popup');
const channel=new BroadcastChannel('orb-replay:'+location.pathname),points=new Map(),finalPoints=new Map(),originKeyFrames=new Map();
let timeline=[],frames=[],manifest=null,binary=null,sequence=-1,frameIndex=0,rendered=-1,revision=null;
function makeView(canvas,mode){return{canvas,ctx:canvas.getContext('2d'),mode,yaw:-.65,pitch:.5,zoom:1,pan:[0,0],center:[0,0,0],extent:.5,currentMap:null,drag:null,needsFit:true,wasMetric:false,hadPoints:false,lastFitFrame:-1,lastAutoFitSource:-Infinity,width:1,height:1};}
const overview=makeView(canvas,'overview'),localView=makeView(localCanvas,'local'),views=[overview,localView];
// Seed once from the first recorded camera of each map/gauge, not the frame
// currently reached by playback or seeking. R_wc columns include camera roll.
const initialMapOrientations=new Map(),mapOrientations=new Map();
function indexInitialMapOrientations(rows){
 initialMapOrientations.clear();
 for(const f of rows){
  if(!f.map_id||f.tail||f.source==='invalid'||!validHandCamera(f.camera))continue;

function syncInitialMapOrientation(){
 if(!revision)return;

 // in the metric world; each phase retains its own initial/user orientation.
 const key=(id==='marker_world'?id:'atlas_'+id)+'|'+Boolean(map.metric),seed=initialMapOrientations.get(key);
 let state=mapOrientations.get(key);
 if(!state){state={basis:seed||null,yaw:seed?0:-.65,pitch:seed?0:.5};mapOrientations.set(key,state);}
 else if(!state.basis&&seed){state.basis=seed;state.yaw=0;state.pitch=0;}
 for(const view of views)if(view.orientationKey!==key||view.baseBasis!==state.basis){
  view.orientationKey=key;view.baseBasis=state.basis;view.yaw=state.yaw;view.pitch=state.pitch;view.needsFit=true;
 }
}
// Both map windows orbit the shared initial basis, independent of head motion.
function viewBasis(view){
 // Both windows share the overhead initial-Ego direction; local only changes
 // center and scale. User orbit offsets never follow current head rotation.
 const tilt=hybridReplay()||finalMapReplay()?Math.PI/2:0;
 const pitch=view.pitch+tilt;
 const cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const orbit=[[cy,0,sy],[sp*sy,cp,-sp*cy],[-cp*sy,sp,cp*cy]];

}
const handView={zoom:1};
const handBones=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
let seekMs=0,presentTimes=[],presentFPS=0;
const reanchorHighlights=[],reanchorPointChanges=new Map();let reanchorIndexed=false;
function indexReanchorHighlights(){const seen=new Set();for(const row of timeline){for(const event of row.marker_graph_events||[]){const key=event.sequence;if(seen.has(key))continue;seen.add(key);if(event.type!=='scale_reanchor'||event.status!=='accepted')continue;const first=frames.findIndex(f=>(f.observation_sequence??f.sequence)>=row.sequence);if(first>=0)reanchorHighlights.push({sequence:row.sequence,first,map:event.map_id,scale:event.scale,keyframes:new Set(event.affected_keyframes||[])});}}}
function pointStateAt(target,mapId){const state=new Map();if(target<0)return state;let first=target;while(first>0&&!timeline[first].checkpoint)first--;for(let s=first;s<=target;s++){const row=timeline[s];if(row.checkpoint)state.clear();for(let i=0;i<row.count;i++){const o=row.offset+i*28;if(Number(binary.getBigUint64(o,true))!==mapId)continue;state.set(Number(binary.getBigUint64(o+8,true)),[binary.getFloat32(o+16,true),binary.getFloat32(o+20,true),binary.getFloat32(o+24,true)]);}for(const[m,id]of row.deleted)if(m===mapId)state.delete(id);}return state;}
function replayLoopEvents(){return Array.isArray(manifest?.loop_events)?manifest.loop_events:[];}
function replaySourceFps(){return Number(manifest?.source_fps)||Number(manifest?.fps)||30;}
function currentSourceFrame(view=overview){return Number(mapFrame(view)?.source_frame??frameIndex);}
function reachedLoopEvents(view=overview){const source=currentSourceFrame(view);return replayLoopEvents().filter(event=>Number(event.source_frame)<=source+1);}
function activeLoopEvent(view=overview){const source=currentSourceFrame(view),tolerance=Math.max(1,Math.round(replaySourceFps()*.5));return replayLoopEvents().filter(event=>Math.abs(Number(event.source_frame)-source)<=tolerance).sort((a,b)=>Number(a.source_frame)-Number(b.source_frame)).at(-1)||null;}
function updateVideoLoopBanner(){
 const banner=$('video-loop-banner');
 if(!banner||!banner.style)return;
 const event=activeLoopEvent(overview)||activeLoopEvent(localView);
 if(!event){banner.style.display='none';banner.textContent='';return;}
 banner.style.display='block';
 banner.textContent=`↺ 回环前 → 回环后 · KF ${event.keyframe_a} ↔ ${event.keyframe_b} · ${Number(event.timestamp_s).toFixed(2)} s`;
 banner.title=`提交：${event.commit_source==='offline-finalize'?'收尾离线检索':'在线'} · ${Number(event.commit_timestamp_s).toFixed(2)} s`;
}
function drawLoopTransition(view,event){
 const raw=frames[frameIndex],before=raw?.process_camera,after=raw?.camera;
 if(finitePoint(before?.translation)&&finitePoint(after?.translation)){line(view,before.translation,after.translation,'#b84955',.9,4);dot(view,before.translation,'#b84955',6);dot(view,after.translation,'#00a44a',6);}
 const context=view.ctx,boxWidth=Math.min(view.width-20,430),x=10,y=10;
 context.save();context.globalAlpha=.96;context.fillStyle='#fff6f3';context.fillRect(x,y,boxWidth,56);context.strokeStyle='#c66a72';context.lineWidth=1;context.strokeRect(x,y,boxWidth,56);
 context.fillStyle='#9d3845';context.font='bold 14px system-ui';context.fillText('↺ 回环前 → 回环后 · 已提交',x+10,y+21);
 context.fillStyle='#586274';context.font='12px system-ui';context.fillText(`KF ${event.keyframe_a} ↔ ${event.keyframe_b} · ${Number(event.timestamp_s).toFixed(2)} s`,x+10,y+40);
 context.fillText(`提交：${event.commit_source==='offline-finalize'?'收尾离线检索':'在线'} · ${Number(event.commit_timestamp_s).toFixed(2)} s`,x+190,y+40);

}
function finalMapReplay(){return manifest?.replay_mode==='final-map';}
function hybridReplay(){return manifest?.replay_mode==='hybrid';}
function finalLocalView(){return hybridReplay()&&manifest?.local_view==='final-labels';}
function offlineView(view=overview){return finalMapReplay()||(hybridReplay()&&(view.mode==='overview'||finalLocalView()));}
function mapRevision(view=overview){return offlineView(view)?timeline.at(-1):revision;}
function mapFrame(view=overview){

 // empty/invalid when no camera measurement existed at this time.

}
function mapPoints(view=overview){return hybridReplay()&&offlineView(view)?finalPoints:points;}
function indexFinalPoints(){finalPoints.clear();if(!hybridReplay())return;let first=timeline.length-1;while(first>0&&!timeline[first].checkpoint)first--;for(let i=first;i<timeline.length;i++){if(timeline[i].checkpoint)finalPoints.clear();block(timeline[i],finalPoints);}}
// Resize may draw before async resources arrive; do not seal an empty event index.
function reanchorHighlight(mapId,view=localView){if(!manifest||!timeline.length||!frames.length||offlineView(view))return null;if(!reanchorIndexed){indexReanchorHighlights();reanchorIndexed=true;}const windowFrames=Math.round((manifest?.fps||30)*4);return reanchorHighlights.findLast(h=>h.map===mapId&&frameIndex>=h.first&&frameIndex<h.first+windowFrames);}
function drawReanchorHighlight(view,m,ordered){const h=reanchorHighlight(m.id,view);if(!h)return;const key=h.sequence+':'+m.id;let changed=reanchorPointChanges.get(key);if(!changed){const before=pointStateAt(h.sequence-1,m.id),after=pointStateAt(h.sequence,m.id);changed=new Set();for(const[id,p]of after){const old=before.get(id);if(old&&Math.hypot(...p.map((v,i)=>v-old[i]))>1e-7)changed.add(id);}reanchorPointChanges.set(key,changed);}const active=localPointIds(view);view.ctx.fillStyle='rgba(0,0,0,.85)';for(const id of changed){if(Math.abs(id)%10>=9||active.has(id))continue;const p=mapPoints(view).get(m.id+':'+id);if(!p)continue;const[x,y]=project(view,p.slice(1));if(x>=0&&x<view.width&&y>=0&&y<view.height)view.ctx.fillRect(x,y,2.2,2.2);}if($('kfs').checked){for(let i=1;i<ordered.length;i++){const a=ordered[i-1],b=ordered[i];if(h.keyframes.has(a[0])||h.keyframes.has(b[0]))line(view,a[2].slice(0,3),b[2].slice(0,3),'#00a84f',1,3);}}drawReanchorBadge(view,h);}
function drawReanchorBadge(view,h){
 const context=view.ctx,s=Number(h.scale),valid=Number.isFinite(s)&&s>0;
 context.save();context.globalAlpha=1;context.fillStyle='rgba(240,250,242,.95)';
 context.fillRect(10,10,Math.min(view.width-20,370),48);
 context.fillStyle='#27643a';context.font='bold 14px system-ui';
 context.fillText('↻ 尺度重锚定 · 已提交',20,29);
 context.font='12px system-ui';
 context.fillText((valid?'尺度 ×'+s.toFixed(4)+'（'+((s-1)*100).toFixed(2)+'%） · ':'')+h.keyframes.size+' 个关键帧',20,48);

}
video.addEventListener('play',()=>{presentTimes=[];});
video.addEventListener('seeking',()=>{presentTimes=[];}); // fit resets only for a real time jump, not every exported frame.
function decodeTimeline(data){
 if(Array.isArray(data))return data;
 if(data?.schema!=='native-orb-shared-timeline/v1'||!Array.isArray(data.rows)||!Array.isArray(data.maps)||!Array.isArray(data.marker_graph_events))throw Error('不支持的地图时间线格式');
 const ref=(pool,id)=>{if(!Number.isInteger(id)||id<0||id>=pool.length)throw Error('地图时间线引用无效');return pool[id];};
 return data.rows.map(row=>{const result={...row,maps:row.maps.map(id=>ref(data.maps,id))};if(Object.hasOwn(row,'marker_graph_events'))result.marker_graph_events=ref(data.marker_graph_events,row.marker_graph_events);return result;});
}
async function readReplayJSON(stream,name,limit=128*1024*1024){
 const reader=stream.getReader(),chunks=[];let bytes=0;
 try{while(true){const{done,value}=await reader.read();if(done)break;bytes+=value.byteLength;if(bytes>limit){await reader.cancel();throw Error(name+' 解压后超过浏览器安全限额；请运行 scripts/compact_slam_replay.py 升级此回放包（无需重跑 SLAM）');}chunks.push(value);}}
 finally{reader.releaseLock();}

}
async function replayResource(name){
 if(location.protocol==='file:')throw Error('不能直接用 file:// 打开回放。请用 replay_orb_slam.py 启动完整回放目录，再打开它输出的 http://127.0.0.1 链接；aruco_track/slam_replay.html 只是模板。');
 let response;
 try{response=await fetch(name,{cache:'no-store'});}
 catch(error){throw Error(`无法连接回放资源 ${name}：本地服务可能已退出或连接被阻止。请重新启动该回放目录并使用新链接；旧端口不会自动恢复。`);}

async function gz(name,type){

}
function block(row,target=points){for(let i=0;i<row.count;i++){const o=row.offset+i*28,m=Number(binary.getBigUint64(o,true)),id=Number(binary.getBigUint64(o+8,true));target.set(m+':'+id,[m,binary.getFloat32(o+16,true),binary.getFloat32(o+20,true),binary.getFloat32(o+24,true)]);}for(const [m,id] of row.deleted)target.delete(m+':'+id);}

function availableMaps(view=overview){const maps=mapRevision(view)?.maps||[],independent=mapFrame(view)?.marker_world_view;return independent?[...maps,independent]:maps;}
// Keep the complete overview selection logic in the historical no-argument
// entry point: a few external replay integrations extract this function in
// isolation.  The view-aware implementation below is intentionally parallel
// so local and overview windows can select their own historical map.
function selectMap(){
 // Some older integrations extract only this function and provide the
 // historical `revision`/`frames` variables, without constructing view
 // objects.  Keep that narrow fallback self-contained while the real viewer
 // delegates overview selection to the view-aware implementation.  Passing a
 // view as the first argument remains supported for older callers even though
 // the formal signature intentionally stays parameterless for extraction.

}
function selectMapForView(view){view=view||overview;

  if(f?.map_id!=null)return null;

  return state?.maps.length===1?state.maps[0].id:null;

}
const keyframeBirthMaps=new Map();
function indexKeyframeBirthMaps(rows){keyframeBirthMaps.clear();for(const row of rows)for(const m of row.maps||[])for(const k of m.keyframes||[])if(!keyframeBirthMaps.has(k[0]))keyframeBirthMaps.set(k[0],m.id);}
function sameTrajectoryRun(a,b){const x=keyframeBirthMaps.get(a[0]),y=keyframeBirthMaps.get(b[0]);return x!==undefined&&x===y;}
function frameTrajectoryMap(f){const id=f?.process_map_id??f?.map_id;return /^atlas_\d+$/.test(id||'')?Number(id.slice(6)):null;}
function indexOriginKeyFrames(rows){indexKeyframeBirthMaps(rows);for(const row of rows)for(const m of row.maps||[]){if(originKeyFrames.has(m.id)||!m.keyframes?.length)continue;originKeyFrames.set(m.id,Math.min(...m.keyframes.map(k=>k[0])));}}

function mapPointEntries(m,local=false,view=overview){const ids=local?localPointIds(view):null,result=[];for(const[key,p]of mapPoints(view)){if(p[0]!==m.id)continue;const pointId=Number(key.split(':')[1]);if(!ids||ids.has(pointId))result.push(p.slice(1));}return result;}

// each edge only when its later keyframe has actually been reached; otherwise
// the overview leaks future information into the past.  This same gate is
// used by the local and global views so the two windows share one clock.
